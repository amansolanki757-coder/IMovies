services:
  - type: web
    name: imovies-cinema
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false

